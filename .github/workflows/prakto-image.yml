name: Prakto Akademi image

# Builds the Prakto Akademi image (this LearnHouse fork: web + API + collab in
# one container, see ./Dockerfile) and pushes it to GHCR:
#   ghcr.io/<owner>/<repo>:latest       newest build of main
#   ghcr.io/<owner>/<repo>:sha-<7 hex>  pin this in production
# The upstream LearnHouse workflows are disabled in this repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: prakto-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Image name and tags
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "tags=${image}:latest,${image}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            LEARNHOUSE_PUBLIC=true
            BUILD_ID=${{ github.sha }}
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
